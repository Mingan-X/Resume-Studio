name: resume-studio

services:
  # Reuse local images, never another project's containers or data volumes.
  postgres:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    pull_policy: never
    environment:
      POSTGRES_USER: resume_studio_owner
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run pnpm infra:init}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U resume_studio_owner -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.4.0-management@sha256:753099a19b577c322117f793f864b3129cbba96d40317221a69d73976e3c843c
    pull_policy: never
    hostname: resume-studio-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: resume_studio_test
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run pnpm infra:init}
      RABBITMQ_DEFAULT_VHOST: resume-studio-s12-test
    ports:
      - '127.0.0.1:55672:5672'
      - '127.0.0.1:55673:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 5s
      timeout: 5s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.20.2@sha256:d277592721d2e3b73f9b797b53cf05e6a5bb2134f6d13fdbda4ca51782afbcac
    pull_policy: never
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Run pnpm infra:init}
    ports:
      - '127.0.0.1:56333:6333'
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  rabbitmq_data:
  qdrant_data:
