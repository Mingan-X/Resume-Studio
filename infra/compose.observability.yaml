name: resume-studio

x-observability: &observability
  profiles: [observability]
  networks: [observability]

x-langfuse-env: &langfuse-env
  HOSTNAME: 0.0.0.0
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD:?Run observability:init}@langfuse-postgres:5432/langfuse
  NEXTAUTH_URL: http://127.0.0.1:53000
  SALT: ${LANGFUSE_SALT:?Run observability:init}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?Run observability:init}
  TELEMETRY_ENABLED: 'false'
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: 'false'
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Run observability:init}
  CLICKHOUSE_CLUSTER_ENABLED: 'false'
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET:?Run observability:init}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET:?Run observability:init}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: 'false'
  REDIS_HOST: langfuse-redis
  REDIS_PORT: '6379'
  REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:?Run observability:init}
  LANGFUSE_INGESTION_QUEUE_DELAY_MS: '100'
  LANGFUSE_INGESTION_CLICKHOUSE_WRITE_INTERVAL_MS: '1000'
  LANGFUSE_IN_APP_AGENT_ENABLED: 'false'
  LANGFUSE_AI_GATEWAY_ENABLED: 'false'

x-dependencies: &dependencies
  langfuse-postgres: { condition: service_healthy }
  langfuse-redis: { condition: service_healthy }
  langfuse-clickhouse: { condition: service_healthy }
  langfuse-minio: { condition: service_healthy }

services:
  langfuse-web:
    <<: *observability
    image: docker.langfuse.com/langfuse/langfuse:4.84.0@sha256:98dda704ccb87c5704a29eeac4a9de313fcfe9f3d1f01e1df9b8adba31f92d3b
    pull_policy: never
    depends_on: *dependencies
    ports: ['127.0.0.1:53000:3000']
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?Run observability:init}
      LANGFUSE_INIT_ORG_ID: resume-studio-local
      LANGFUSE_INIT_ORG_NAME: Resume Studio Local
      LANGFUSE_INIT_PROJECT_ID: resume-studio-diagnostics
      LANGFUSE_INIT_PROJECT_NAME: Resume Studio Diagnostics
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?Run observability:init}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?Run observability:init}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?Run observability:init}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?Run observability:init}
      LANGFUSE_INIT_USER_NAME: Local Developer
      AUTH_DISABLE_SIGNUP: 'true'
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://127.0.0.1:59090
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/public/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  langfuse-worker:
    <<: *observability
    image: docker.langfuse.com/langfuse/langfuse-worker:4.84.0@sha256:34c122feaa110afc8b1174d8c9933ec707d670b67e0e58334aaff43d5ce012f6
    pull_policy: never
    depends_on:
      <<: *dependencies
      langfuse-web: { condition: service_healthy }
    environment: *langfuse-env
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3030/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  langfuse-postgres:
    <<: *observability
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    pull_policy: never
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_DB: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?Run observability:init}
    volumes: ['langfuse_postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U langfuse -d langfuse']
      interval: 5s
      timeout: 3s
      retries: 20
  langfuse-redis:
    <<: *observability
    image: redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    pull_policy: never
    environment:
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:?Run observability:init}
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDIS_AUTH" --maxmemory-policy noeviction --appendonly yes']
    volumes: ['langfuse_redis_data:/data']
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_AUTH" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
  langfuse-clickhouse:
    <<: *observability
    image: clickhouse/clickhouse-server:26.3.62.3@sha256:de3e47c64078aa196dae2349e048fc98ba81947f651f5c20e06e46baea8ae40a
    pull_policy: never
    user: '101:101'
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Run observability:init}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8123/ping']
      interval: 5s
      timeout: 5s
      retries: 20
  langfuse-minio:
    <<: *observability
    image: cgr.dev/chainguard/minio:latest@sha256:f6243be11aaaa2fe654d260558e2b3fcef50135e78a3abfd0db802b13444f059
    pull_policy: never
    entrypoint: sh
    command: ['-c', 'mkdir -p /data/langfuse && exec minio server --address ":9000" --console-address ":9001" /data']
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: ${LANGFUSE_S3_SECRET:?Run observability:init}
    ports: ['127.0.0.1:59090:9000']
    volumes: ['langfuse_minio_data:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  observability:

volumes:
  langfuse_postgres_data:
    external: true
    name: ${LANGFUSE_POSTGRES_DATA_VOLUME:-resume-studio_langfuse_postgres_data}
  langfuse_redis_data:
    external: true
    name: ${LANGFUSE_REDIS_DATA_VOLUME:-resume-studio_langfuse_redis_data}
  langfuse_clickhouse_data:
    external: true
    name: ${LANGFUSE_CLICKHOUSE_DATA_VOLUME:-resume-studio_langfuse_clickhouse_data}
  langfuse_clickhouse_logs:
    external: true
    name: ${LANGFUSE_CLICKHOUSE_LOGS_VOLUME:-resume-studio_langfuse_clickhouse_logs}
  langfuse_minio_data:
    external: true
    name: ${LANGFUSE_MINIO_DATA_VOLUME:-resume-studio_langfuse_minio_data}
